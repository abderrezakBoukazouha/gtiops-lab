name: Build, Push, and Deploy

on:
  push:
    branches:
      - master # Corrected to your branch name

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      # --- NEW STEP ADDED HERE ---
      - name: ⚙️ Set image name to lowercase
        id: string
        run: |
          # Takes the original repo name and converts it to lowercase
          # Then "exports" it as an environment variable for subsequent steps
          echo "IMAGE_NAME_LC=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          # --- MODIFIED HERE ---
          # Use the new lowercase environment variable
          images: ghcr.io/${{ env.IMAGE_NAME_LC }}
          tags: |
            type=sha,prefix=,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: ⚙️ Update Kubernetes deployment manifest
        run: |
          # --- MODIFIED HERE ---
          # Use the new lowercase environment variable
          NEW_IMAGE_TAG="ghcr.io/${{ env.IMAGE_NAME_LC }}:${{ steps.meta.outputs.version }}"
          sed -i "s|image:.*|image: ${NEW_IMAGE_TAG}|g" k8s/deployment.yaml

      - name: 🚀 Commit and push the updated manifest
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git diff-index --quiet HEAD || git commit -m "ci: update deployment image to ${{ steps.meta.outputs.version }}"
          git push